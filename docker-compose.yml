services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bleach-soul-society-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-bleach_soul_society}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci
      DB_USER: ${DB_USER:?Configura DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - bleach-internal
      - bleach-ingress

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-bleach_soul_society}
      MYSQL_USER: ${DB_USER:?Configura DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - bleach-internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - bleach-internal
      - bleach-ingress

networks:
  bleach-internal:
    driver: bridge
    internal: true
  bleach-ingress:
    driver: bridge

volumes:
  mysql_data: